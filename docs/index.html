<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadrastro</title>
    <link rel="stylesheet" href="formulario.css">
</head>

<body>
    <header>
            <h1 class="nav-brand">Formulário de Inscrição/Cadastro</h1>
    </header>

    <main>
        <form action="1cadastrados.html" method="post">
            <section id="dados">
                <fieldset>
                    <legend>1.Dados Pessoais</legend>
                    
                        <div class="form-group">
                            <label for="name">Nome Completo *</label>
                            <input type="text" name="nome" id="name" placeholder="Ex: Digite um nome com no mínimo 10 caracteres" required>
                        </div>

                        <div class="form-group">
                            <label for="email">E-mail *</label>
                            <input type="email" name="email" id="email" placeholder="Ex: layssa@gmail.com" required>
                        </div>

                        <div class="form-group">
                            <label for="telefone">Telefone/Whatsapp</label>
                            <input type="tel" name="telefone" id="telefone" placeholder="Ex: (55) 97854-7892"
                                pattern="\[0-9]\{2}\s?[0-9\]{4,5}-?[0-9\]{4}">
                        </div>
                        <div class="form-group">
                            <label for="nascimento">Data de nascimento *</label>
                            <input type="date" name="nascimento" id="nascimento" max="2026-09-09" required>
                        </div>   
                        <div class="form-group">
                            <label for="cpf">CPF *</label>
                            <input type="text" name="cpf" id="cpf"  placeholder="Ex: 000.000.000-00" required>
                        </div>                    
                </fieldset>
            </section>

            <section id="perfil">   
                <fieldset>
                    <legend>2.Preferência e Perfil</legend>
                
                        <div class="form-group">
                            <label for="ctrl-areas">Áreas de Interesse *</label>
                                <select name="areas" id="ctrl-areas" required>
                                    <option value="">Selecione áreas de interesse</option>
                                    <option value=1>Front-end</option>
                                    <option value="Back-end">Back-end</option>
                                    <option value="full-stalk">Full-stalk</option>
                                    <option value="Desenvolvimento mobile">Desenvolvimento mobile</option>
                                    <option value="Ciência de dados">Ciência de dados</option>
                                </select>
                         </div>

                        <div class="form-group">
                            <label for="nivel">Nivel de Experiência *</label>
                                <div>
                                    <input type="radio" name="nivel" id="iniciante" value="iniciante" checked required>
                                    <label for="iniciante">Iniciante</label>
                                    <input type="radio" name="nivel" id="intermediario" value="intermediario" required>
                                    <label for="intermediario">Intermediário</label>
                                    <input type="radio" name="nivel" id="avancado" value="avancado" required>
                                    <label for="avancado">Avançado</label>

                                </div>
                        </div>

                        <div class="form-group">
                            <br><label for="ctrl-biografia">Biografia/Apresentação</label>
                            <textarea name="biografia" id="ctrl-biografia" placeholder="Conte um pouco sobre suas experiências"></textarea>
                        </div>
                </fieldset>
            </section>

            <section id="Redes">
                <fieldset>
                    <legend>3.Redes Sociais</legend>

                        <div class="form-group">
                            <label for="Github">GitHub *</label>
                            <input type="url" name="Github" id="Github" placeholder="Ex: https://pages.github.com" required>
                        </div>
                        <div class="form-group">
                            <label for="LinkedIn">LinkedIn *</label>
                            <input type="url" name="LinkedIn" id="LinkedIn" placeholder="Ex: https://linkedin.com" required>
                        </div>
                        <div>
                            <input type="checkbox" name="novidades" id="ctrl-novidades" value="true">
                            <label for="ctrl-novidades">Aceito receber novidades por e-mails</label>
                        </div>

                </fieldset>         
            </section>     

                    <button type="submit">Concluir Cadastro</button>
                    <button type="reset">Limpar Formulário</button>
        </form>
    </main>
</body>
</html>
